# Environment for host filtering, read QC, Woltka and the Python merge scripts.
# Create with: conda env create -f pipeline/00_setup/environment_metagenomic.yml
name: metagenomic_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - fastp=1.3.3
  - fastqc=0.12.1
  - multiqc=1.35
  - minimap2=2.30
  - samtools=1.6
  - seqtk
  - seqkit=2.13.0
  - bowtie2=2.5.5
  - pigz
  - pandas
  - numpy
  - biom-format
  - pip
  - pip:
      - woltka==0.1.7
